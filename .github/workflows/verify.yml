name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: ci-root-ephemeral
          MYSQL_DATABASE: stockflow_test
          MYSQL_USER: stockflow_test
          MYSQL_PASSWORD: ci-test-ephemeral
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      STOCKFLOW_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stockflow_test?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
      STOCKFLOW_TEST_DB_USERNAME: stockflow_test
      STOCKFLOW_TEST_DB_PASSWORD: ci-test-ephemeral
      STOCKFLOW_DEMO_PASSWORD: ci-local-demo-only-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
