name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: ci-root-ephemeral
          MYSQL_DATABASE: stockflow_test
          MYSQL_USER: stockflow_test
          MYSQL_PASSWORD: ci-test-ephemeral
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      STOCKFLOW_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stockflow_test?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
      STOCKFLOW_TEST_DB_USERNAME: stockflow_test
      STOCKFLOW_TEST_DB_PASSWORD: ci-test-ephemeral
      STOCKFLOW_DEMO_PASSWORD: ci-local-demo-only-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test src/test/frontend/*.test.mjs
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/performance-evidence.json

  container-smoke:
    runs-on: ubuntu-latest
    env:
      STOCKFLOW_MYSQL_ROOT_PASSWORD: ci-root-ephemeral
      STOCKFLOW_DB_PASSWORD: ci-app-ephemeral
      STOCKFLOW_DEMO_PASSWORD: ci-local-demo-only-12345
      STOCKFLOW_HTTP_PORT: '8083'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for the application
        run: |
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8083/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check authenticated API and database
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/api/auth/me)" = 401
          curl -fsS -u "warehouse:$STOCKFLOW_DEMO_PASSWORD" http://127.0.0.1:8083/api/inventory/reconciliation | python3 -c 'import json,sys; assert json.load(sys.stdin)["mismatchCount"] == 0'
      - run: docker compose logs --no-color --tail=80
        if: failure()
      - run: docker compose down
        if: always()
