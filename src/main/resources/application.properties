spring.application.name=stockflow
server.address=127.0.0.1
server.port=8082
spring.profiles.default=local
spring.datasource.url=${STOCKFLOW_DB_URL:jdbc:mysql://127.0.0.1:3308/stockflow_dev?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC}
spring.datasource.username=${STOCKFLOW_DB_USERNAME:stockflow}
spring.datasource.password=${STOCKFLOW_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=4
spring.flyway.clean-disabled=true
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
stockflow.demo-password=${STOCKFLOW_DEMO_PASSWORD}
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
