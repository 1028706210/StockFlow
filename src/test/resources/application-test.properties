spring.datasource.url=${STOCKFLOW_TEST_DB_URL:jdbc:mysql://127.0.0.1:3308/stockflow_test?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC}
spring.datasource.username=${STOCKFLOW_TEST_DB_USERNAME:stockflow_test}
spring.datasource.password=${STOCKFLOW_TEST_DB_PASSWORD}
logging.level.root=WARN

stockflow.expiration.enabled=false
# 库存业务的32路Basic并发回归使用独立测试预算；账号安全专项显式设为3，运行默认仍为8。
stockflow.auth.failure-limit=64
